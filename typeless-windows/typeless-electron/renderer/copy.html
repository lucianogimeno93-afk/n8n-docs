<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Copiar texto</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; background: #1e1e1e; color: #fff; }
  h3   { margin: 0 0 12px; font-size: 14px; color: #aaa; font-weight: 400; }
  textarea {
    width: 100%; height: 160px; resize: vertical;
    background: #2d2d2d; color: #fff; border: 1px solid #444;
    border-radius: 8px; padding: 10px; font-size: 14px;
    font-family: inherit; outline: none;
  }
  .actions { margin-top: 12px; display: flex; gap: 10px; }
  button {
    padding: 9px 22px; border-radius: 8px; border: none;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #btnCopy { background: #0a84ff; color: #fff; }
  #btnCopy:hover { background: #0070d8; }
  #btnClose { background: #3a3a3a; color: #fff; }
  #copied { color: #30d158; font-size: 13px; display: none; margin-top: 8px; }
</style>
</head>
<body>
<h3>Texto muy largo para pegar automáticamente</h3>
<textarea id="txt" readonly></textarea>
<div class="actions">
  <button id="btnCopy">Copiar al portapapeles</button>
  <button id="btnClose">Cerrar</button>
</div>
<p id="copied">¡Copiado!</p>
<script>
  window.api.onSetText(text => { document.getElementById('txt').value = text })

  document.getElementById('btnCopy').onclick = async () => {
    const text = document.getElementById('txt').value
    await window.api.copyText(text)
    const msg = document.getElementById('copied')
    msg.style.display = 'block'
    setTimeout(() => msg.style.display = 'none', 2000)
  }
  document.getElementById('btnClose').onclick = () => window.close()
</script>
</body>
</html>
